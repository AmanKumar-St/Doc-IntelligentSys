services:
  - type: web
    name: doc-intelligence-backend
    rootDir: backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://doc-intelligent-sys.vercel.app
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: MAX_QUERY_LENGTH
        value: "2000"
      - key: MAX_CHAT_MESSAGE_LENGTH
        value: "4000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: UPLOAD_RATE_LIMIT
        value: "5"
      - key: UPLOAD_RATE_WINDOW_SECONDS
        value: "3600"
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: CHAT_RATE_WINDOW_SECONDS
        value: "3600"
      - key: SEARCH_RATE_LIMIT
        value: "60"
      - key: SEARCH_RATE_WINDOW_SECONDS
        value: "3600"
      - key: QDRANT_URL
        value: https://e9edec85-6617-49bf-b299-032dfb818357.australia-southeast1-0.gcp.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: USE_EMBEDDED_QDRANT
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: EMBEDDING_MODEL
        value: nvidia/nemotron-3-embed-1b:free
      - key: EMBEDDING_DIMENSION
        value: "2048"
      - key: RERANKER_PROVIDER
        value: openrouter
      - key: RERANKER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: GENERATION_PROVIDER
        value: openrouter
      - key: GENERATION_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: GENERATION_FALLBACK_PROVIDER
        value: openrouter
      - key: GENERATION_FALLBACK_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CODECRAFT_API_KEY
        sync: false
      - key: UNOROUTER_API_KEY
        sync: false
      - key: UNOROUTER_BASE_URL
        value: https://api.unorouter.com/v1